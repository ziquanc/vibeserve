<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeServe Blueprint</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #111827;
    --panel:     #1F2937;
    --border:    #374151;
    --text:      #E5E7EB;
    --muted:     #9CA3AF;
    --primary:   #7C3AED;
    --secondary: #06B6D4;
    --success:   #22C55E;
    --error:     #EF4444;
    --warning:   #F59E0B;
    --radius:    6px;
    --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    height: 52px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  #header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 15px;
  }

  .logo {
    width: 28px; height: 28px;
    background: var(--primary);
    border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: #fff;
  }

  #poll-status {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
  }
  .dot.live { background: var(--success); animation: pulse 2s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
  }

  #content {
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  #empty-state {
    text-align: center;
    padding: 80px 24px;
    color: var(--muted);
  }
  #empty-state .icon { font-size: 48px; margin-bottom: 16px; }
  #empty-state p { font-size: 15px; }

  .bp-header { margin-bottom: 28px; }

  .bp-title-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }

  .bp-title {
    font-size: 22px;
    font-weight: 700;
  }

  .score-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
  }
  .score-green  { background: rgba(34,197,94,0.15);  color: #22C55E; border: 1px solid rgba(34,197,94,0.3); }
  .score-yellow { background: rgba(245,158,11,0.15); color: #F59E0B; border: 1px solid rgba(245,158,11,0.3); }
  .score-red    { background: rgba(239,68,68,0.15);  color: #EF4444; border: 1px solid rgba(239,68,68,0.3); }

  .bp-description { color: var(--muted); font-size: 14px; }

  .section { margin-bottom: 28px; }

  .section-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 8px;
  }
  .breaking-card { border-left: 3px solid var(--error); }

  .change-row { display: flex; align-items: flex-start; gap: 10px; }
  .change-icon { font-size: 16px; flex-shrink: 0; }
  .change-detail { color: var(--text); flex: 1; }
  .change-type {
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--muted);
    margin-top: 2px;
  }

  .hint-item {
    display: flex; align-items: flex-start; gap: 8px;
    margin-bottom: 6px; color: #67E8F9;
  }
  .hint-item .sym { color: #22D3EE; font-weight: 700; flex-shrink: 0; }

  .suggestion-item {
    display: flex; align-items: flex-start; gap: 8px;
    margin-bottom: 6px; color: #FCD34D;
  }
  .suggestion-item .sym { color: var(--warning); flex-shrink: 0; }

  .warning-item {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 14px;
    background: rgba(239,68,68,0.08);
    border: 1px solid rgba(239,68,68,0.2);
    border-radius: var(--radius);
    margin-bottom: 6px;
    color: #FCA5A5;
  }
  .warning-item .sym { color: var(--error); flex-shrink: 0; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }

  th {
    text-align: left;
    padding: 8px 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }

  td {
    padding: 9px 12px;
    border-bottom: 1px solid rgba(55,65,81,0.5);
    vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }

  .method {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .method-GET    { background: rgba(34,197,94,0.15);  color: #22C55E; }
  .method-POST   { background: rgba(59,130,246,0.15); color: #60A5FA; }
  .method-PUT    { background: rgba(249,115,22,0.15); color: #FB923C; }
  .method-PATCH  { background: rgba(234,179,8,0.15);  color: #EAB308; }
  .method-DELETE { background: rgba(239,68,68,0.15);  color: #EF4444; }

  .path-cell    { font-family: var(--font-mono); font-size: 12px; color: #A5B4FC; }
  .col-type     { font-family: var(--font-mono); font-size: 12px; color: #86EFAC; }
  .col-constraints { font-size: 11px; color: var(--muted); }

  .table-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 16px;
  }

  .table-name {
    padding: 10px 14px;
    font-weight: 700;
    font-size: 13px;
    background: rgba(124,58,237,0.1);
    border-bottom: 1px solid var(--border);
    color: #C4B5FD;
    font-family: var(--font-mono);
  }

  .script-block {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 12px;
  }

  .script-name {
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    background: rgba(0,0,0,0.2);
    border-bottom: 1px solid var(--border);
    font-family: var(--font-mono);
  }

  pre {
    padding: 14px 16px;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.7;
    color: #D1FAE5;
    overflow-x: auto;
    white-space: pre;
  }

  #footer {
    text-align: center;
    padding: 20px;
    color: var(--muted);
    font-size: 13px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    position: fixed;
    bottom: 0; left: 0; right: 0;
  }

  /* ER Diagram */
  .er-section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 28px;
    overflow-x: auto;
  }
  .er-section .mermaid { text-align: center; }
  .er-section .mermaid svg { max-width: 100%; height: auto; }

  /* Interactive highlight for routes */
  .route-highlight { background: rgba(124,58,237,0.15) !important; }
  .table-wrap.active-table { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }

  .er-hint {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
</head>
<body>

<div id="header">
  <div id="header-brand">
    <div class="logo">V</div>
    <span>VibeServe</span>
    <span style="color:var(--muted);font-weight:400">/ Blueprint Preview</span>
  </div>
  <div id="poll-status">
    <div class="dot" id="dot"></div>
    <span id="poll-label">connecting...</span>
  </div>
</div>

<div id="content">
  <div id="empty-state" style="display:none">
    <div class="icon">&#128196;</div>
    <p>No pending blueprint. Submit a prompt in the terminal to generate one.</p>
  </div>
  <div id="blueprint" style="display:none"></div>
</div>

<div id="footer">Return to your terminal to approve or refine this blueprint.</div>

<script>
/* All user content is set via textContent or element attributes — no innerHTML on untrusted data. */

function el(tag, opts) {
  const e = document.createElement(tag);
  if (opts) {
    if (opts.cls) e.className = opts.cls;
    if (opts.text !== undefined) e.textContent = opts.text;
    if (opts.style) e.style.cssText = opts.style;
    if (opts.attrs) Object.entries(opts.attrs).forEach(([k,v]) => e.setAttribute(k, v));
  }
  return e;
}

function append(parent, ...children) {
  children.forEach(c => c && parent.appendChild(c));
  return parent;
}

function scoreClass(s) {
  if (s >= 7) return 'score-green';
  if (s >= 4) return 'score-yellow';
  return 'score-red';
}

function methodTag(m) {
  const span = el('span', { cls: 'method method-' + (m || 'GET').toUpperCase(), text: m || '' });
  return span;
}

function sectionEl(title) {
  const sec = el('div', { cls: 'section' });
  const hdr = el('div', { cls: 'section-title', text: title });
  sec.appendChild(hdr);
  return sec;
}

function renderBlueprint(data) {
  const frag = document.createDocumentFragment();
  const steps = data.steps || [];
  const m = data.manifest || {};
  const score = (data.heuristics && data.heuristics.score) || 0;
  const hints = (data.heuristics && data.heuristics.hints) || [];
  const suggestions = (data.heuristics && data.heuristics.suggestions) || [];
  const warnings = data.warnings || [];
  const changes = data.changes || [];
  const breaking = changes.filter(c => c.breaking);
  const nonBreaking = changes.filter(c => !c.breaking);

  // ---- Plan mode: show steps ----
  if (steps.length > 0 && !m.name) {
    const header = el('div', { cls: 'bp-header' });
    const titleRow = el('div', { cls: 'bp-title-row' });
    append(titleRow,
      el('span', { cls: 'bp-title', text: 'Execution Plan' }),
      el('span', { cls: 'score-badge score-yellow', text: steps.length + ' steps' })
    );
    header.appendChild(titleRow);
    if (data.prompt) {
      header.appendChild(el('div', { cls: 'bp-description', text: 'Prompt: ' + data.prompt }));
    }
    frag.appendChild(header);

    const sec = sectionEl('Steps');
    steps.forEach(function(step, i) {
      const card = el('div', { cls: 'card' });
      const row = el('div', { cls: 'change-row' });
      const num = el('span', { cls: 'change-icon', text: (i + 1) + '.', style: 'color:var(--secondary);font-weight:700;font-family:var(--font-mono)' });
      const body = el('div', { cls: 'change-detail', text: step });
      append(row, num, body);
      card.appendChild(row);
      sec.appendChild(card);
    });
    frag.appendChild(sec);

    // Show ER diagram from server-generated Mermaid (available even in plan mode)
    if (data.diagram) {
      var erSec = sectionEl('Entity Relationship Diagram');
      var wrap = el('div', { cls: 'er-section' });
      var mermaidDiv = el('div', { cls: 'mermaid' });
      mermaidDiv.textContent = data.diagram;
      wrap.appendChild(mermaidDiv);

      // Add "Open fullscreen" button — opens diagram in a new tab
      var fullBtn = el('button', {
        text: '⛶ Open fullscreen',
        style: 'margin-top:12px;padding:6px 16px;background:var(--primary);color:white;border:none;border-radius:6px;cursor:pointer;font-size:13px'
      });
      fullBtn.addEventListener('click', function() {
        window.open('/_blueprint/diagram', '_blank');
      });
      wrap.appendChild(fullBtn);

      erSec.appendChild(wrap);
      frag.appendChild(erSec);
    }

    frag.appendChild(el('div', { style: 'text-align:center;color:var(--muted);padding:20px;font-size:13px', text: 'Type "y" in the terminal to approve and execute, or type feedback to refine.' }));
    return frag;
  }

  // ---- Header ----
  const header = el('div', { cls: 'bp-header' });
  const titleRow = el('div', { cls: 'bp-title-row' });
  append(titleRow,
    el('span', { cls: 'bp-title', text: m.name || 'Blueprint' }),
    el('span', { cls: 'score-badge ' + scoreClass(score), text: 'Score ' + score + '/10' })
  );
  header.appendChild(titleRow);
  if (m.description) {
    header.appendChild(el('div', { cls: 'bp-description', text: m.description }));
  }
  frag.appendChild(header);

  // ---- ER Diagram ----
  var schemas = m.schemas || [];
  if (schemas.length > 0) {
    var erSec = renderERDiagram(schemas);
    if (erSec) frag.appendChild(erSec);
  }

  // ---- Breaking changes ----
  if (breaking.length > 0) {
    const sec = sectionEl('\u26A0 Breaking Changes');
    breaking.forEach(c => {
      const card = el('div', { cls: 'card breaking-card' });
      const row = el('div', { cls: 'change-row' });
      const icon = el('span', { cls: 'change-icon', text: '\u26A0', style: 'color:var(--error)' });
      const body = el('div');
      append(body,
        el('div', { cls: 'change-detail', text: c.detail }),
        el('div', { cls: 'change-type', text: c.type })
      );
      append(row, icon, body);
      card.appendChild(row);
      sec.appendChild(card);
    });
    frag.appendChild(sec);
  }

  // ---- Warnings ----
  if (warnings.length > 0) {
    const sec = sectionEl('Warnings');
    warnings.forEach(w => {
      const item = el('div', { cls: 'warning-item' });
      append(item,
        el('span', { cls: 'sym', text: '\u26A0' }),
        el('span', { text: w })
      );
      sec.appendChild(item);
    });
    frag.appendChild(sec);
  }

  // ---- Highlights ----
  if (hints.length > 0) {
    const sec = sectionEl('Highlights');
    hints.forEach(h => {
      const item = el('div', { cls: 'hint-item' });
      append(item,
        el('span', { cls: 'sym', text: '\u2726' }),
        el('span', { text: h })
      );
      sec.appendChild(item);
    });
    frag.appendChild(sec);
  }

  // ---- Suggestions ----
  if (suggestions.length > 0) {
    const sec = sectionEl('Suggestions');
    suggestions.forEach(s => {
      const item = el('div', { cls: 'suggestion-item' });
      append(item,
        el('span', { cls: 'sym', text: '\u2192' }),
        el('span', { text: s })
      );
      sec.appendChild(item);
    });
    frag.appendChild(sec);
  }

  // ---- Other changes ----
  if (nonBreaking.length > 0) {
    const sec = sectionEl('Changes');
    nonBreaking.forEach(c => {
      const card = el('div', { cls: 'card' });
      const row = el('div', { cls: 'change-row' });
      const icon = el('span', { cls: 'change-icon', text: '+', style: 'color:var(--success)' });
      const body = el('div');
      append(body,
        el('div', { cls: 'change-detail', text: c.detail }),
        el('div', { cls: 'change-type', text: c.type })
      );
      append(row, icon, body);
      card.appendChild(row);
      sec.appendChild(card);
    });
    frag.appendChild(sec);
  }

  // ---- Routes table ----
  const routes = m.routes || [];
  if (routes.length > 0) {
    const sec = sectionEl('Routes');
    sec.id = 'routes-section';
    const wrap = el('div', { cls: 'table-wrap' });
    const tbl = el('table');
    tbl.id = 'routes-table';
    const thead = el('thead');
    const hrow = el('tr');
    ['Method','Path','Script','Description'].forEach(h => hrow.appendChild(el('th', { text: h })));
    thead.appendChild(hrow);
    tbl.appendChild(thead);
    const tbody = el('tbody');
    routes.forEach(r => {
      const tr = el('tr');
      const tdm = el('td');
      tdm.appendChild(methodTag(r.method));
      const tdp = el('td', { cls: 'path-cell', text: r.path || '' });
      const tds = el('td', { text: r.script || '', style: 'font-family:var(--font-mono);font-size:12px;color:var(--muted)' });
      const tdd = el('td', { text: r.description || '', style: 'color:var(--muted)' });
      append(tr, tdm, tdp, tds, tdd);
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    wrap.appendChild(tbl);
    sec.appendChild(wrap);
    frag.appendChild(sec);
  }

  // ---- Schemas ----
  if (schemas.length > 0) {
    const sec = sectionEl('Schemas');
    schemas.forEach(schema => {
      const wrap = el('div', { cls: 'table-wrap' });
      wrap.appendChild(el('div', { cls: 'table-name', text: schema.table || '' }));
      const tbl = el('table');
      const thead = el('thead');
      const hrow = el('tr');
      ['Column','Type','Constraints'].forEach(h => hrow.appendChild(el('th', { text: h })));
      thead.appendChild(hrow);
      tbl.appendChild(thead);
      const tbody = el('tbody');
      (schema.columns || []).forEach(col => {
        const constraints = [];
        if (col.primary_key || col.primaryKey) constraints.push('PRIMARY KEY');
        if (col.not_null || col.notNull) constraints.push('NOT NULL');
        if (col.unique) constraints.push('UNIQUE');
        if (col.default !== undefined && col.default !== null && col.default !== '') {
          constraints.push('DEFAULT ' + col.default);
        }
        const tr = el('tr');
        append(tr,
          el('td', { text: col.name || '', style: 'font-weight:600' }),
          el('td', { cls: 'col-type', text: col.type || '' }),
          el('td', { cls: 'col-constraints', text: constraints.join(', ') })
        );
        tbody.appendChild(tr);
      });
      tbl.appendChild(tbody);
      wrap.appendChild(tbl);
      sec.appendChild(wrap);
    });
    frag.appendChild(sec);
  }

  // ---- Scripts ----
  const scripts = m.scripts || [];
  if (scripts.length > 0) {
    const sec = sectionEl('Scripts');
    scripts.forEach(s => {
      const block = el('div', { cls: 'script-block' });
      block.appendChild(el('div', { cls: 'script-name', text: s.name || '' }));
      const pre = el('pre');
      pre.textContent = s.code || '';
      block.appendChild(pre);
      sec.appendChild(block);
    });
    frag.appendChild(sec);
  }

  return frag;
}

// ---- ER Diagram ----

function buildMermaidER(schemas) {
  if (!schemas || schemas.length === 0) return '';
  var lines = ['erDiagram'];
  // Entities
  schemas.forEach(function(s) {
    var tbl = (s.table || 'table').replace(/[^a-zA-Z0-9_]/g, '');
    lines.push('    ' + tbl + ' {');
    (s.columns || []).forEach(function(c) {
      var mType = (c.type || 'text').toLowerCase().replace(/[^a-z0-9]/g, '');
      var colName = (c.name || 'col').replace(/[^a-zA-Z0-9_]/g, '');
      var attr = '';
      if (c.primary) attr = 'PK';
      else if (c.unique) attr = 'UK';
      else if (c.references) attr = 'FK';
      var suffix = attr ? ' ' + attr : '';
      lines.push('        ' + mType + ' ' + colName + suffix);
    });
    lines.push('    }');
  });
  // Relationships from references
  schemas.forEach(function(s) {
    var srcTbl = (s.table || '').replace(/[^a-zA-Z0-9_]/g, '');
    (s.columns || []).forEach(function(c) {
      if (!c.references) return;
      var ref = parseReference(c.references);
      if (ref) {
        var refTbl = ref.table.replace(/[^a-zA-Z0-9_]/g, '');
        var colName = (c.name || '').replace(/[^a-zA-Z0-9_]/g, '');
        lines.push('    ' + refTbl + ' ||--o{ ' + srcTbl + ' : ' + colName);
      }
    });
  });
  return lines.join('\n');
}

function parseReference(ref) {
  // "table.column" or "table(column)"
  var m = ref.match(/^(\w+)[.(](\w+)\)?$/);
  if (m) return { table: m[1], column: m[2] };
  return null;
}

function renderERDiagram(schemas) {
  var code = buildMermaidER(schemas);
  if (!code) return null;

  var sec = sectionEl('Entity Relationship Diagram');
  var wrap = el('div', { cls: 'er-section' });
  var mermaidDiv = el('div', { cls: 'mermaid' });
  mermaidDiv.textContent = code;
  wrap.appendChild(mermaidDiv);
  wrap.appendChild(el('div', { cls: 'er-hint', text: 'Click a table name to highlight related routes below.' }));
  sec.appendChild(wrap);
  return sec;
}

// Interactive click handler: highlight related routes when a table node is clicked
function setupERInteraction(schemas, routes) {
  // Wait for Mermaid to render SVG
  setTimeout(function() {
    var svg = document.querySelector('.er-section svg');
    if (!svg) return;

    // Find all entity labels in the SVG
    var entityLabels = svg.querySelectorAll('.entityLabel, text');
    entityLabels.forEach(function(label) {
      var text = (label.textContent || '').trim().toLowerCase();
      // Check if this text matches a table name
      var matchedTable = schemas.find(function(s) {
        return s.table.toLowerCase() === text;
      });
      if (matchedTable) {
        label.style.cursor = 'pointer';
        label.addEventListener('click', function() {
          highlightRoutesForTable(matchedTable.table, routes);
        });
      }
    });
  }, 500);
}

function highlightRoutesForTable(tableName, routes) {
  // Clear previous highlights
  document.querySelectorAll('.route-highlight').forEach(function(el) {
    el.classList.remove('route-highlight');
  });
  document.querySelectorAll('.table-wrap.active-table').forEach(function(el) {
    el.classList.remove('active-table');
  });

  // Highlight schema table
  document.querySelectorAll('.table-name').forEach(function(el) {
    if (el.textContent.trim() === tableName) {
      el.parentElement.classList.add('active-table');
    }
  });

  // Highlight routes whose path starts with /tableName
  var routeRows = document.querySelectorAll('#routes-table tbody tr');
  routeRows.forEach(function(row) {
    var pathCell = row.querySelector('.path-cell');
    if (!pathCell) return;
    var path = pathCell.textContent.trim();
    // Match /tableName or /tableName/:id or /tableName/:id/action
    if (path === '/' + tableName || path.startsWith('/' + tableName + '/')) {
      row.classList.add('route-highlight');
    }
  });

  // Scroll to routes section
  var routesSec = document.getElementById('routes-section');
  if (routesSec) routesSec.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

mermaid.initialize({
  startOnLoad: false,
  theme: 'dark',
  themeVariables: {
    primaryColor: '#7C3AED',
    primaryTextColor: '#E5E7EB',
    lineColor: '#6B7280',
    secondaryColor: '#1F2937',
    tertiaryColor: '#374151'
  }
});

var lastJSON = '';

async function poll() {
  try {
    const res = await fetch('/_api/blueprint');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();

    // Skip re-render if data hasn't changed
    if (text === lastJSON) return;
    lastJSON = text;

    const data = JSON.parse(text);

    document.getElementById('dot').className = 'dot live';
    document.getElementById('poll-label').textContent = 'live';

    const empty = document.getElementById('empty-state');
    const bp = document.getElementById('blueprint');

    var footer = document.getElementById('footer');

    if (data.status === 'none') {
      empty.style.display = 'block';
      bp.style.display = 'none';
      footer.style.display = 'none';
    } else {
      empty.style.display = 'none';
      bp.style.display = 'block';
      bp.textContent = '';
      bp.appendChild(renderBlueprint(data));

      // Show/hide footer based on status
      if (data.status === 'pending') {
        footer.textContent = 'Return to your terminal to approve or refine this blueprint.';
        footer.style.display = 'block';
      } else {
        footer.textContent = 'Current API manifest. Submit a new prompt to modify.';
        footer.style.display = 'block';
      }

      // Render Mermaid diagrams
      try {
        await mermaid.run({ nodes: bp.querySelectorAll('.mermaid') });
        // Setup click interaction after Mermaid renders
        var m = data.manifest || {};
        if (m.schemas && m.routes) {
          setupERInteraction(m.schemas, m.routes);
        }
      } catch(e) {
        console.warn('Mermaid render error:', e);
      }
    }
  } catch (e) {
    document.getElementById('dot').className = 'dot';
    document.getElementById('poll-label').textContent = 'error \u2013 retrying';
  }
}

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
