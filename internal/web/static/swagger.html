<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeServe API Docs</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
<style>
  body { margin: 0; background: #fafafa; }
  #header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 24px;
    background: #111827;
    border-bottom: 1px solid #374151;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #E5E7EB;
    font-size: 15px;
    font-weight: 700;
  }
  .logo {
    width: 28px; height: 28px;
    background: #7C3AED;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: #fff;
  }
  .muted { color: #9CA3AF; font-weight: 400; }
  .swagger-ui .topbar { display: none; }
  #empty {
    text-align: center;
    padding: 80px 24px;
    color: #6B7280;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
</style>
</head>
<body>
<div id="header">
  <div class="logo">V</div>
  <span>VibeServe</span>
  <span class="muted">/ API Documentation</span>
</div>
<div id="swagger-ui"></div>
<div id="empty" style="display:none">
  <p style="font-size:48px;margin-bottom:16px">&#128203;</p>
  <p style="font-size:15px">No API routes defined yet. Create an API in the terminal first.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
  SwaggerUIBundle({
    url: '/_api/openapi.yaml',
    dom_id: '#swagger-ui',
    presets: [SwaggerUIBundle.presets.apis],
    layout: 'BaseLayout',
    deepLinking: true,
    defaultModelsExpandDepth: 1,
    onComplete: function() {
      // If no content rendered, show empty state
      var ops = document.querySelectorAll('.opblock');
      if (ops.length === 0) {
        var info = document.querySelector('.swagger-ui .info');
        if (!info) {
          document.getElementById('swagger-ui').style.display = 'none';
          document.getElementById('empty').style.display = 'block';
        }
      }
    }
  });
</script>
</body>
</html>
